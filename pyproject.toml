[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-audiobook"
version = "0.1.0"
description = "离线中文多人有声小说桌面工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Niezhiyv" },
]
keywords = ["audiobook", "chinese", "kokoro", "offline", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "charset-normalizer>=3.3,<4",
    "imageio-ffmpeg>=0.6,<0.7",
    "kokoro-onnx>=0.6,<0.7",
    "numpy>=2.0,<3",
    "PySide6>=6.8,<7",
    "soundfile>=0.12,<0.14",
]

[project.urls]
Repository = "https://github.com/Niezhiyv/novel-audiobook"
Issues = "https://github.com/Niezhiyv/novel-audiobook/issues"

[project.gui-scripts]
audiobook = "app.__main__:main"

[dependency-groups]
dev = [
    "mutagen>=1.47,<2",
    "pyinstaller>=6.11,<7",
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
